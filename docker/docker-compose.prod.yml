services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the backend reaches Postgres over the internal network.

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # Loopback only — Caddy on the host is the only public entry point.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3002}:3002"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
